[project]
name = "ssyk-adk-agent"
version = "0.1.0"
description = "Google ADK chatbot for Swedish occupation classification"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "litellm",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_agent"]
